<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>慢学校</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
      background-color: #fafaf8;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    main {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      margin-bottom: 1.5rem;
      color: #1a1a1a;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #666;
      letter-spacing: 0.05em;
    }

    hr {
      width: 40px;
      border: none;
      border-top: 2px solid #ccc;
      margin: 1.8rem auto;
    }
  </style>
</head>
<body>
  <main>
    <h1>慢学校</h1>
    <hr>
    <p>帮助 AI 时代的长期价值创造者，<br>从可能性视角重新设计自己的事业与人生</p>
  </main>
</body>
</html>
